name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, but let in-progress ones finish.
# Cancelling a Pages deployment mid-flight can make the backend reject the
# next one with "Deployment failed, try again later", so cancel-in-progress
# must stay false (matches GitHub's official Pages starter workflow).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build character changes index
        run: python3 scripts/build_changes_index.py

      - name: Build character quirks
        run: python3 scripts/build_quirks.py

      - name: Build credits
        run: python3 scripts/build_credits.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
